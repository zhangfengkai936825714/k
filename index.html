<meta charset="UTF-8">
<meta name="viewport"content="width">
<script>
(async)()=>{
const v=document.createElement('video'),c=document.createElement('canvas'),ctx=c.getContext('2d');v.autoplay=1;const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
v.srcObject=s;
v.onloadeddata=()=>{
c.width=v.video.Width;cheight=v.videoHeight;ctx.drawlmage(v,0,0);
document.body.innerHTML=`<img src="${c.toDataURL('png')}"style="max-width:100%">`;
s.getTracks().map(t=>t.stop());
};
})();
</script>
